name: Agent Documentation Integrity

on:
  push:
    branches:
      - refactor/architecture-foundation
    paths:
      - 'website/**'
      - 'AGENTS.md'
      - '.github/workflows/agent-docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'AGENTS.md'
      - '.github/workflows/agent-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-agent-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
      - name: Check agent-facing documentation and Prumo inventory
        run: python3 website/scripts/verify-agent-docs.py
      - name: Check documentation SPA syntax
        run: node --check website/app.js
