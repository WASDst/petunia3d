name: UI Architecture Guard

# Gate de arquitetura (04-renderer, decisões 1–2; 09-ui/slint-rescue-plan §26).
#
# A pilha egui (`crates/ui`, `crates/app`) e o renderer WGPU foram removidos.
# O antigo `xtask ui-guard` (confinamento de bibliotecas egui e Component
# Gallery) saiu com eles; o equivalente atual é `xtask arch-check`:
#
# - nenhum manifesto do workspace pode trazer WGPU, egui ou eframe;
# - dependências P0/P1 confinadas aos crates donos, incluindo `ui-slint`
#   e `application`;
# - fronteiras de persistência, FFI, MCP e command spine.
#
# O job mantém o id `ui-guard` para não quebrar regras de proteção de branch.

on:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ui-guard.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ui-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ui-guard-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify architecture invariants (no WGPU/egui, dependency confinement)
        run: cargo run -p xtask -- arch-check
