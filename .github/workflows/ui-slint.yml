name: UI editor (core + petunia_editor)

# Gate do núcleo de interface toolchain-neutro: `petunia_core` + `petunia_editor`,
# que alimentam o frontend Qt Widgets (`petunia_ui_cxxqt`).
#
# O frontend Slint (`petunia_ui_slint`) foi removido pela migração aprovada no
# decision register (2026-10-15); este workflow protegia esse crate e passou a
# falhar com "package `petunia_ui_slint` is not a member of the workspace".
# Os comandos são os gates do AGENTS.md para o núcleo e o editor.
#
# O job mantém o id `ui-slint` para não quebrar regras de proteção de branch
# (mesmo critério do `ui-guard`).

on:
  push:
    branches:
      - main
      - refactor/architecture-foundation
    paths:
      - 'crates/editor/**'
      - 'crates/core/**'
      - 'crates/config/**'
      - 'crates/project/**'
      - 'crates/mesh/**'
      - 'crates/render/**'
      - 'assets/locales/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ui-slint.yml'
  pull_request:
    paths:
      - 'crates/editor/**'
      - 'crates/core/**'
      - 'crates/config/**'
      - 'crates/project/**'
      - 'crates/mesh/**'
      - 'crates/render/**'
      - 'assets/locales/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ui-slint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-slint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-slint:
    name: ui-slint
    runs-on: ubuntu-latest
    # Sem debuginfo e com paralelismo limitado o pico de memória cabe no runner
    # padrão (orçamento do AGENTS.md: CARGO_BUILD_JOBS ≤ 4).
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bibliotecas nativas que o editor compila: `wayland-sys` (via o diálogo de
      # arquivos `rfd`) procura `wayland-client` pelo pkg-config, e o `bindgen` do
      # `xatlas-rs-v2` (malha) precisa da libclang.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev libclang-dev

      # A versão vem do rust-toolchain.toml do repositório.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ui-editor-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt -p petunia_core -p petunia_editor -- --check

      - name: Clippy
        run: cargo clippy -p petunia_core -p petunia_editor --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p petunia_core --lib

      - name: Editor tests (lib + integration)
        run: cargo test -p petunia_editor --features animation-workspace
