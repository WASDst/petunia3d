name: UI Slint

# Gate do frontend de produção (`petunia_ui_slint`, AGENTS.md §0.1).
#
# Até aqui nenhum workflow cobria `crates/ui-slint/`: o `ui-guard.yml` vale só
# para a UI egui legada. Este gate roda os mesmos comandos documentados no
# README do crate e no AGENTS.md, e protege a refatoração modular (ADR 008).

on:
  push:
    branches:
      - main
      - refactor/architecture-foundation
    paths:
      - 'crates/ui-slint/**'
      - 'crates/xtask/**'
      - 'crates/config/**'
      - 'crates/core/**'
      - 'assets/locales/**'
      - 'assets/themes/**'
      - 'assets/icons/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ui-slint.yml'
  pull_request:
    paths:
      - 'crates/ui-slint/**'
      - 'crates/xtask/**'
      - 'crates/config/**'
      - 'crates/core/**'
      - 'assets/locales/**'
      - 'assets/themes/**'
      - 'assets/icons/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ui-slint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-slint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-slint:
    runs-on: ubuntu-latest
    # `petunia_ui_slint` gera um único crate muito grande (lib.rs + app.slint):
    # com debuginfo e jobs paralelos o runner esgotava a memória ao compilar a
    # segunda configuração de features e era derrubado (exit 143). Sem debuginfo
    # e com paralelismo limitado, o pico de memória cabe no runner padrão.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Slint (winit + femtovg) e wgpu precisam de headers de sistema em runner limpo.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # Margem de memória para o rustc de `petunia_ui_slint` (vários GB por
      # instância); sem swap o runner é derrubado (exit 143).
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile-ci
          sudo chmod 600 /mnt/swapfile-ci
          sudo mkswap /mnt/swapfile-ci
          sudo swapon /mnt/swapfile-ci
          free -h

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ui-slint-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt -p petunia_ui_slint -- --check

      - name: Design tokens (no literal color/font/shadow in .slint)
        run: cargo run -p xtask -- ui-lint

      - name: Clippy
        run: cargo clippy -p petunia_ui_slint --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test -p petunia_ui_slint --lib

      # Com a feature, a lib e o harness `--lib` de `petunia_ui_slint` são
      # recompilados ao mesmo tempo; um job por vez mantém o pico de memória
      # em uma instância do rustc.
      - name: Integration tests (workspace shells + viewport gestures)
        env:
          CARGO_BUILD_JOBS: 1
        run: >
          cargo test -p petunia_ui_slint --features animation-workspace
          --lib --test animate_shell --test viewport_gestures
          --test model_shell --test uv_shell --test paint_shell --test viewport_hud
