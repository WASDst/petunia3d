[workspace]
exclude = ["fuzz"]
members = [
    "crates/core",
    "crates/mesh",
    "crates/commands",
    "crates/config",
    "crates/project",
    "crates/plugins",
    "crates/mcp",
    "crates/render",
    "crates/render-gl",
    "crates/render-wgpu",
    "crates/module-model",
    "crates/module-paint",
    "crates/module-uv",
    "crates/module-assets",
    "crates/ui",
    "crates/ui-slint",
    "crates/app",
    "crates/xtask",
    "crates/cli",
    "crates/ffi",
]
resolver = "2"

[workspace.dependencies]
egui = "0.36.2"
egui-winit = "0.36.2"
egui-wgpu = "0.36.2"
egui_glow = { version = "0.36.2", features = ["winit"] }
eframe = "0.36.2"
wgpu = "30.0.1"
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
slotmap = "1"
rayon = "1"
flume = "0.12"
tempfile = "3"
schemars = "1"
geo = "0.33"
manifold-rust = "0.13"
gltf-json = "1.4"
tobj = "4"
egui_extras = { version = "0.36.2", features = ["image", "svg"] }
iconflow = { version = "1.0", features = ["pack-lucide", "pack-iconoir"] }
proptest = "1"
zip = "2"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
rmcp = { version = "3.3", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "io-std"] }
xatlas-rs-v2 = "0.1"
notify = "8"
egui_inbox = "0.13"
egui_taffy = "0.14"
# Macro-layout controlado do shell (`PetuniaLayoutAdapter`). Sem serde de
# propósito: o contrato durável é o DTO Petunia, nunca a árvore da crate.
egui_tiles = { version = "0.17.1", default-features = false }
# Drag-and-drop real em listas ordenáveis (Wave 7, §49). Traz `egui_animation`
# como transitiva — a mesma versão que o backend de motion usa.
egui_dnd = "0.17"
# Backend de motion atrás de `foundation::motion` (Wave 7, §49).
egui_animation = "0.13"
# Validação por campo atrás do contrato `adapters::form` (Wave 9, §51).
egui_form = "0.10"
twill = { version = "0.2", default-features = false }
egui_commonmark = "0.25"
egui_autocomplete = "15"
criterion = "0.8"
egui_inspection = { version = "0.36.2", features = ["plugin"] }
egui_mcp = "0.2"
egui-probe = { version = "0.13", features = ["derive"] }
puffin = "0.20"
assert_fs = "1"
insta = { version = "1", features = ["json"] }
petunia_core = { path = "crates/core" }
petunia_mesh = { path = "crates/mesh" }
petunia_commands = { path = "crates/commands" }
petunia_config = { path = "crates/config" }
petunia_project = { path = "crates/project" }
petunia_render = { path = "crates/render" }
petunia_render_gl = { path = "crates/render-gl" }
petunia_render_wgpu = { path = "crates/render-wgpu" }
petunia_module_model = { path = "crates/module-model" }
petunia_module_paint = { path = "crates/module-paint" }
petunia_module_uv = { path = "crates/module-uv" }
petunia_module_assets = { path = "crates/module-assets" }
petunia_ui = { path = "crates/ui" }
petunia_ui_slint = { path = "crates/ui-slint" }
petunia_app = { path = "crates/app" }
petunia_cli = { path = "crates/cli" }
petunia_ffi = { path = "crates/ffi" }
petunia_mcp = { path = "crates/mcp" }
petunia_plugins = { path = "crates/plugins" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98.1"

[package]
name = "petunia3d"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Petunia3D — editor low-poly shape-first (OpenGL-first, modular)"

[[bin]]
name = "petunia3d"
path = "src/main.rs"

[features]
default = []
# Workspace Animate (P3D-066/170, ADR 006). Fora da V1 congelada (capítulo 36:
# MODEL/PAINT/UV). Habilite explicitamente: liga a pill ANIMATE no shell Slint de
# produção e, para transição, o painel do egui legado (`--legacy-egui`).
animation-workspace = ["petunia_ui_slint/animation-workspace", "petunia_app/animation-workspace"]

[dependencies]
petunia_ui_slint = { workspace = true }
petunia_app = { workspace = true }
petunia_mcp = { workspace = true }
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
