[workspace]
exclude = ["fuzz"]
members = [
    "crates/core",
    "crates/application",
    "crates/mesh",
    "crates/commands",
    "crates/config",
    "crates/project",
    "crates/plugins",
    "crates/mcp",
    "crates/render",
    "crates/module-model",
    "crates/module-paint",
    "crates/module-uv",
    "crates/module-assets",
    "crates/ui-slint",
    "crates/xtask",
    "crates/cli",
    "crates/ffi",
    "crates/ui-cxxqt",
]
resolver = "2"

[workspace.dependencies]
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
glow = "0.17"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
slotmap = "1"
rayon = "1"
flume = "0.12"
tempfile = "3"
schemars = "1"
geo = "0.33"
manifold-rust = "0.13"
gltf-json = "1.4"
tobj = "4"
proptest = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
resvg = { version = "0.48.1", default-features = false }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
rmcp = { version = "3.3", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "io-std"] }
xatlas-rs-v2 = "0.1"
criterion = "0.8"
puffin = "0.20"
assert_fs = "1"
insta = { version = "1", features = ["json"] }
petunia_core = { path = "crates/core" }
petunia_mesh = { path = "crates/mesh" }
petunia_commands = { path = "crates/commands" }
petunia_config = { path = "crates/config" }
petunia_project = { path = "crates/project" }
petunia_render = { path = "crates/render" }
petunia_application = { path = "crates/application" }
petunia_module_model = { path = "crates/module-model" }
petunia_module_paint = { path = "crates/module-paint" }
petunia_module_uv = { path = "crates/module-uv" }
petunia_module_assets = { path = "crates/module-assets" }
petunia_ui_slint = { path = "crates/ui-slint" }
petunia_ui_cxxqt = { path = "crates/ui-cxxqt" }
petunia_cli = { path = "crates/cli" }
petunia_ffi = { path = "crates/ffi" }
petunia_mcp = { path = "crates/mcp" }
petunia_plugins = { path = "crates/plugins" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98.1"

[package]
name = "petunia3d"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Petunia3D — editor low-poly shape-first (OpenGL-first, modular)"
default-run = "petunia3d"

[[bin]]
name = "petunia3d"
path = "src/main.rs"

[features]
default = []
# Workspace Animate (P3D-066/170, ADR 006). Fora da V1 congelada (capítulo 36:
# MODEL/PAINT/UV). Habilite explicitamente: liga a pill ANIMATE no shell Slint.
animation-workspace = ["petunia_ui_slint/animation-workspace"]

[dependencies]
petunia_ui_slint = { workspace = true }
petunia_application = { workspace = true }
petunia_mcp = { workspace = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
