idth="2.6" fill="none"  marker-end="url(#arrow)"/><rect x="372" y="205" width="278" height="165" rx="16" fill="#1c3249" stroke="#4b718b" stroke-width="1.5" filter="url(#shadow)"/><rect x="387" y="221" width="4" height="133" rx="2" fill="#9ca7e3"/><text x="404" y="242" fill="#f0f6fc" font-family="Inter, system-ui, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">02 · PREVIEW</text><text x="404" y="268" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Geometria ghost</text><text x="404" y="290" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Referência original</text><path d="M651 285 L684 285" stroke="#82b7da" stroke-width="2.6" fill="none"  marker-end="url(#arrow)"/><rect x="686" y="205" width="278" height="165" rx="16" fill="#1c3249" stroke="#4b718b" stroke-width="1.5" filter="url(#shadow)"/><rect x="701" y="221" width="4" height="133" rx="2" fill="#e0b976"/><text x="718" y="242" fill="#f0f6fc" font-family="Inter, system-ui, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">03 · PRECISÃO</text><text x="718" y="268" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Cotas e restrições</text><text x="718" y="290" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Avisos antes da falha</text><path d="M965 285 L998 285" stroke="#82b7da" stroke-width="2.6" fill="none"  marker-end="url(#arrow)"/><rect x="1000" y="205" width="278" height="165" rx="16" fill="#1c3249" stroke="#4b718b" stroke-width="1.5" filter="url(#shadow)"/><rect x="1015" y="221" width="4" height="133" rx="2" fill="#8ccea9"/><text x="1032" y="242" fill="#f0f6fc" font-family="Inter, system-ui, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="start">04 · RESULTADO</text><text x="1032" y="268" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Commit atômico</text><text x="1032" y="290" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">ou Esc rollback</text><rect x="178" y="454" width="930" height="105" rx="16" fill="#1c3249" stroke="#4b718b" stroke-width="1.5" filter="url(#shadow)"/><rect x="193" y="470" width="4" height="73" rx="2" fill="#7bc0d7"/><text x="210" y="491" fill="#f0f6fc" font-family="Inter, system-ui, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="start">Command Dispatcher · revisioned transaction</text><text x="210" y="517" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Preview calculada a partir do snapshot original; render nunca altera documento</text><text x="210" y="539" fill="#a8c2d3" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Qt envia intents; Rust valida; Undo cobre todas as geometrias afetadas</text><path d="M197 370V416" stroke="#7398b1" fill="none" stroke-width="1.8" stroke-dasharray="5 5"/><path d="M512 370V416" stroke="#7398b1" fill="none" stroke-width="1.8" stroke-dasharray="5 5"/><path d="M827 370V416" stroke="#7398b1" fill="none" stroke-width="1.8" stroke-dasharray="5 5"/><path d="M1137 370V416" stroke="#7398b1" fill="none" stroke-width="1.8" stroke-dasharray="5 5"/><circle cx="206" cy="608" r="4" fill="#84c3a1"/><text x="216" y="612" fill="#b7d3de" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Avisos não intrusivos e alternativa por teclado</text><circle cx="689" cy="608" r="4" fill="#84c3a1"/><text x="699" y="612" fill="#b7d3de" font-family="Inter, system-ui, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start">Nada é corrigido automaticamente sem escolha 