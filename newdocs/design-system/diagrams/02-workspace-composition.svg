<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc">
<title id="title">Petunia3D: proposed workspace hierarchy and responsivity</title><desc id="desc">Professional desktop shell: top application bar and workspace switcher; a compact left tool rail; large central 3D viewport with a small contextual viewport toolbar and compact context actions; right Parts tree and Property Inspector; slim bottom status bar. Paint UV and Animate reuse the same shell but specialize the document area and panels.</desc>
