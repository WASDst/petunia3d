<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Petunia3D: canonical design system architecture</title>
<desc id="desc">The Rust configuration core supplies canonical semantic theme, localization, and preference snapshots to a Qt UI bridge. The bridge feeds a Qt style layer, a component library, patterns, panels and workspace shell. The Rust editor supplies command results and state independently.</desc>
<defs><style>.bg{fill:#181a20}.card{fill:#252933;stroke:#495163;stroke-width:1.6}.canonical{fill:#352c48;stroke:#9779d9;stroke-width:2}.accent{fill:#293c45;stroke:#5d9cb6;stroke-width:1.5}.title{fill:#f0eff6;font:700 25px system-ui,sans-serif}.h{fill:#eeeef3;font:700 18px system-ui,sans-serif}.body{fill:#acb3c2;font:14px system-ui,sans-serif}.line{fill:none;stroke:#8b91a1;stroke-width:2;marker-end:url(#arrow)}.small{fill:#b2b7c7;font:13px system-ui,sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b91a1"/></marker></defs>
<rect class="bg" width="1200" height="780" rx="20"/>
<text x="52" y="62" class="title">Petunia Design System</text><text x="52" y="89" class="body">Arquitetura de tokens, componentes e interfaces · Rust + Qt 6 Widgets</text>
<rect class="canonical" x="52" y="130" width="345" height="148" rx="14"/><text class="h" x="75" y="168">petunia_config · Rust</text><text class="body" x="75" y="195">ThemeRegistry / ThemeToken</text><text class="body" x="75" y="218">I18n / Text IDs</text><text class="body" x="75" y="241">UserPreferences / Layout schema</text>
<rect class="accent" x="52" y="326" width="345" height="115" rx="14"/><text class="h" x="75" y="364">petunia_editor · Rust</text><text class="body" x="75" y="392">Commands · View Models · Undo/Redo</text><text class="body" x="75" y="414">Seleção e operações independentes da UI</text>
<rect class="card" x="465" y="200" width="285" height="170" rx="14"/><text class="h" x="487" y="240">Qt Bridge / Adapters</text><text class="body" x="487" y="266">Snapshots resolvidos</text><text class="body" x="487" y="290">IDs semânticos, revisão de estado</text><text class="body" x="487" y="314">Qt GUI-thread dispatch</text><text class="body" x="487" y="338">Persistência validada</text>
<rect class="card" x="819" y="132" width="320" height="105" rx="14"/><text class="h" x="842" y="168">Style Facade</text><text class="body" x="842" y="196">QStyle · QProxyStyle · Ícones SVG</text><text class="small" x="842" y="216">QML auxiliar: tokens derivados</text>
<rect class="card" x="819" y="287" width="320" height="110" rx="14"/><text class="h" x="842" y="326">Component Library</text><text class="body" x="842" y="352">NumberField · Buttons · Sections</text><text class="body" x="842" y="375">Semântica · Foco · Estados</text>
<rect class="card" x="819" y="450" width="320" height="106" rx="14"/><text class="h" x="842" y="487">UI Patterns / Panels</text><text class="body" x="842" y="511">PropertyRow · Outliner · Inspector</text><text class="body" x="842" y="534">Brush · UV · Rig · Timeline</text>
<rect class="canonical" x="819" y="606" width="320" height="116" rx="14"/><text class="h" x="842" y="644">Workspace Composer</text><text class="body" x="842" y="670">DRAW · POLY · PAINT · UV · ANIMATE</text><text class="body" x="842" y="695">Docking · Presets · Layouts de usuário</text>
<path class="line" d="M397 203 H465"/><path class="line" d="M397 383 H428 V324 H465"/><path class="line" d="M750 246 H782 V181 H819"/><path class="line" d="M979 237 V287"/><path class="line" d="M979 397 V450"/><path class="line" d="M979 556 V606"/><path class="line" d="M750 313 H777 V342 H819"/>
<text class="small" x="50" y="725">Regras: nenhuma cor/token em paralelo · nenhuma mutação geométrica no widget · nenhuma surpresa ao restaurar layout.</text>
</svg>
