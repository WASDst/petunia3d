# cargo-deny configuration for Petunia3D
# Enforcing MIT/Apache-2.0 license compliance and supply chain security

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
    # O Petunia3D é GPL-3.0-or-later (LICENSE); o Slint é distribuído sob
    # GPL-3.0-only OR licenças próprias, e usamos a opção GPL-3.0.
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.8

[advisories]
unmaintained = "all"
yanked = "warn"
ignore = [
    "RUSTSEC-2024-0436", # paste 1.0.15 transitive via stackbox -> egui_taffy
    "RUSTSEC-2026-0192", # ttf-parser 0.25.1 transitive via winit -> sctk-adwaita
    "RUSTSEC-2026-0206", # rustybuzz 0.20.1 unmaintained, transitive via usvg/resvg (slint, petunia_project)
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
