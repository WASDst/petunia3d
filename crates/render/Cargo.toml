[package]
name = "petunia_render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
petunia_core = { workspace = true }
petunia_config = { workspace = true }
petunia_project = { workspace = true }
glow = { workspace = true }
glam = { workspace = true }
bytemuck = "1"
uuid = { workspace = true }
puffin = { workspace = true }

[dev-dependencies]
petunia_mesh = { workspace = true }
# Contexto OpenGL sem janela (EGL surfaceless) para os testes de pixel do renderer.
glutin = { version = "0.32", default-features = false, features = ["egl"] }
# Capturas PNG do modo de edição para inspeção visual (B12, "olhar o resultado").
image = { version = "0.25", default-features = false, features = ["png"] }
