[package]
name = "petunia_core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
petunia_mesh = { workspace = true }
petunia_commands = { workspace = true }
petunia_config = { workspace = true }
petunia_project = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
slotmap = { workspace = true }
rayon = { workspace = true }
flume = { workspace = true }
schemars = { workspace = true }

[features]
default = []
# Workspace de animação de P3D-066 (prioridade P3). Fora da V1 congelada
# (capítulo 36: MODEL/PAINT/UV). Desligado por padrão para que o build de V1 não
# exponha um workspace fora do escopo aprovado; o módulo continua compilável.
animation-workspace = []

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "core_jobs"
harness = false

[[bench]]
name = "command_spine"
harness = false

[[bench]]
name = "viewport_queries"
harness = false
