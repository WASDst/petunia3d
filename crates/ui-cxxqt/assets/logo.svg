<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="petunia-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c8cd6" />
      <stop offset="100%" stop-color="#4772b3" />
    </linearGradient>
    <linearGradient id="petunia-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b629b" />
      <stop offset="100%" stop-color="#2a4773" />
    </linearGradient>
    <linearGradient id="petunia-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4772b3" />
      <stop offset="100%" stop-color="#345482" />
    </linearGradient>
  </defs>
  <!-- Isometric 3D Cube with chamfered low-poly aesthetic -->
  <polygon points="50,15 85,34 50,53 15,34" fill="url(#petunia-top)" stroke="#6a9de8" stroke-width="2" />
  <polygon points="15,34 50,53 50,88 15,69" fill="url(#petunia-left)" stroke="#4772b3" stroke-width="2" />
  <polygon points="50,53 85,34 85,69 50,88" fill="url(#petunia-right)" stroke="#4772b3" stroke-width="2" />
  <!-- Center vertex accent badge -->
  <circle cx="50" cy="53" r="4" fill="#e5a93c" stroke="#ffffff" stroke-width="1.5" />
</svg>
