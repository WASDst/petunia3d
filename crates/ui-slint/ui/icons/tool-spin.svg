<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Revolution vertical center axis -->
  <path d="M6 3v18" stroke="#A5AFBF" stroke-width="1.3" stroke-dasharray="2 2"/>
  <!-- Profile curve being revolved -->
  <path d="M6 5c5.5 0 9 3 9 7s-3.5 7-9 7" stroke="#E8EBF0" stroke-width="1.7"/>
  <!-- Upper revolution circular arc with arrowhead -->
  <path d="M14 6a8.5 4 0 0 1 5 3.5 8.5 4 0 0 1-3 3.5m0 0-.5-2.5m.5 2.5 2.5-.5" stroke="#CF7190" stroke-width="2"/>
  <!-- Lower revolution arc -->
  <path d="M14 16a8.5 3 0 0 1 4 2.5" stroke="#CF7190" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Profile key vertices -->
  <circle cx="15" cy="12" r="1.8" fill="#CF7190"/>
  <circle cx="6" cy="5" r="1.3" fill="#A5AFBF"/>
  <circle cx="6" cy="19" r="1.3" fill="#A5AFBF"/>
</svg>
