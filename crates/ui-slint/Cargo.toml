[package]
name = "petunia_ui_slint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
petunia_config = { workspace = true }
petunia_core = { workspace = true }
petunia_mesh = { workspace = true }
petunia_project = { workspace = true }
petunia_render = { workspace = true }
puffin = { workspace = true }
petunia_module_paint = { path = "../module-paint" }
petunia_module_model = { path = "../module-model" }
petunia_module_uv = { path = "../module-uv" }
uuid = { workspace = true }
serde_json = { workspace = true }
glam = { workspace = true }
glow = { workspace = true }
# Mesma versão que o Slint usa em `IntSize` (tamanho de textura GL emprestada).
euclid = "0.22"
rfd = "=0.17.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slint = { version = "=1.18.0", default-features = false, features = [
    "compat-1-18",
    "std",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "raw-window-handle-06",
] }
[build-dependencies]
slint-build = { version = "=1.18.0", default-features = false, features = ["compat-1-18"] }
lucide-slint = "=1.47.0"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
i-slint-backend-testing = "=1.18.0"

[features]
default = []
animation-workspace = ["petunia_core/animation-workspace"]
