[package]
name = "petunia_ui_slint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
petunia_config = { workspace = true }
petunia_core = { workspace = true }
petunia_mesh = { workspace = true }
petunia_project = { workspace = true }
petunia_render = { workspace = true }
petunia_render_wgpu = { path = "../render-wgpu" }
petunia_module_paint = { path = "../module-paint" }
petunia_module_model = { path = "../module-model" }
petunia_module_uv = { path = "../module-uv" }
uuid = { workspace = true }
glam = { workspace = true }
wgpu = { workspace = true }
pollster = "0.4"
rfd = "=0.17.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slint = { version = "=1.18.0", default-features = false, features = [
    "compat-1-18",
    "std",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "unstable-wgpu-30",
    "raw-window-handle-06",
] }
[build-dependencies]
slint-build = { version = "=1.18.0", default-features = false, features = ["compat-1-18"] }

[dev-dependencies]
tempfile = { workspace = true }
i-slint-backend-testing = "=1.18.0"

[features]
default = []
animation-workspace = ["petunia_core/animation-workspace"]
# Mantém a dependência GPL do viewport-lib fora do build padrão até a integração real.
viewport-lib-backend = ["dep:viewport-lib"]

[dependencies.viewport-lib]
version = "=0.22.0"
default-features = false
features = ["wgpu30"]
optional = true
