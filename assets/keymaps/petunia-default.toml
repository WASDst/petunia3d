# Petunia Default Keymap Profile
[profile]
id = "petunia-default"
name = "Petunia Padrão"
description = "Mapa de teclas canônico do Petunia3D com acesso direto a ferramentas e navegação ágil"

[global]
undo = "Ctrl+Z"
redo = "Ctrl+Shift+Z"
save_project = "Ctrl+S"
help = "H"
reset_camera = "Home"
toggle_projection = "Numpad 5"
cycle_mode = "Tab"
rename = "F2"

[paint]
paint = "B"
size_decrease = "["
size_increase = "]"
hardness_decrease = "Shift+["
hardness_increase = "Shift+]"

[model]
box_select = "B"
select_vertex = "1"
select_edge = "2"
select_face = "3"
select_object = "4"
transform = "T"
move = "G"
rotate = "R"
scale = "S"
frame_selection = "F"
extrude = "E"
extrude_individual = "Alt+E"
push_pull = "P"
inset = "I"
bevel = "Ctrl+B"
tool_select = "W"
subdivide = "Alt+W"
merge = "M"
primitives = "Shift+A"
loop_cut = "Ctrl+R"
knife = "K"
delete = "Delete"
