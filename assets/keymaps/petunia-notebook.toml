# Petunia Notebook Keymap Profile
[profile]
id = "petunia-notebook"
name = "Petunia Notebook (Sem Teclado Numérico)"
description = "Otimizado para laptops sem bloco numérico (numpad), mapeando vistas e seleções confortavelmente"

[global]
undo = "Ctrl+Z"
redo = "Ctrl+Shift+Z"
save_project = "Ctrl+S"
reset_camera = "Home"
# F2 é a tecla de seleção de aresta neste perfil (sem numpad), então renomear
# usa Ctrl+F2 aqui para não disputar a mesma tecla.
rename = "Ctrl+F2"

[model]
# Resolve inherited collisions explicitly; false persists an unbound action.
make_face = "Shift+F"
move = false
box_select = "B"
select_vertex = "F1"
select_edge = "F2"
select_face = "F3"
select_object = "F4"
transform = "G"
rotate = "R"
scale = "S"
frame_selection = "F"
extrude = "E"
push_pull = "P"
inset = "I"
loop_cut = "Ctrl+R"
delete = "Backspace"
